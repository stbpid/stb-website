<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resources — Social Technology Bureau</title>
  <link rel="icon" type="image/webp" href="images/stb-new-logo.webp" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.5s ease, transform 0.5s ease; }
    .reveal.revealed { opacity: 1; transform: none; }
    .file-name-link { color: var(--text-dark); transition: color var(--transition); }
    .file-name-link:hover { color: var(--primary-blue); text-decoration: underline; }
    .empty-state { padding: 48px 0; text-align: center; color: var(--text-light); font-size: 14px; }
    .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
    .table-pagination { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 12px 0 4px; flex-wrap: wrap; }
    .table-pagination button { min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 14px; border-radius: 6px; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .table-pagination button:hover:not(:disabled) { background: #f3f4f6; border-color: #9ca3af; }
    .table-pagination button.active { background: var(--primary-blue, #1d4ed8); color: #fff; border-color: var(--primary-blue, #1d4ed8); font-weight: 600; }
    .table-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .category-chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .chip-manual { background: #dbeafe; color: #1e40af; }
    .chip-guidelines { background: #d1fae5; color: #065f46; }
    .chip-briefer { background: #fef3c7; color: #92400e; }
    .chip-storybook { background: #ede9fe; color: #5b21b6; }
    .chip-primer { background: #fce7f3; color: #9d174d; }
    .chip-law { background: #e0f2fe; color: #0369a1; }
    .chip-form { background: #f0fdf4; color: #166534; }
    .chip-presentation { background: #fff7ed; color: #9a3412; }
    .chip-video { background: #fdf2f8; color: #86198f; }

    .resources-search-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
    .resources-search-bar input[type="text"] {
      flex: 1; min-width: 200px; padding: 10px 16px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; color: #374151; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .resources-search-bar input[type="text"]:focus { border-color: var(--primary-blue, #1d4ed8); box-shadow: 0 0 0 3px rgba(29,78,216,0.1); }
    .resources-search-bar select {
      padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; color: #374151; background: #fff; cursor: pointer; outline: none;
      transition: border-color 0.2s;
    }
    .resources-search-bar select:focus { border-color: var(--primary-blue, #1d4ed8); }
    .resources-table-info { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div id="site-header-mount"></div>

  <section class="resources-header-section">
    <div class="container">
      <div class="reveal" style="padding-bottom:32px;">
        <span class="label-tag">Social Technology Unit</span>
        <h1 class="section-title-lg">STB Resources</h1>
        <div class="section-divider"></div>
        <p class="section-subtitle">Access and download official laws, issuances, publications, forms, templates, presentations, and orientation videos from the Social Technology Bureau.</p>
      </div>
    </div>
  </section>

  <section class="resources-tabs-section">
    <div class="container">
      <div class="reveal">

        <div class="resources-search-bar">
          <input type="text" id="res-search" placeholder="Search by file name…" autocomplete="off" />
          <select id="res-category-filter">
            <option value="">All Categories</option>
            <option value="Law">Law</option>
            <option value="Manual">Manual</option>
            <option value="Guidelines">Guidelines</option>
            <option value="Briefer">Briefer</option>
            <option value="Storybook">Storybook</option>
            <option value="Primer">Primer</option>
            <option value="Form">Form</option>
            <option value="Presentation">Presentation</option>
            <option value="Video">Video</option>
          </select>
        </div>

        <div class="resources-table-info" id="res-table-info"></div>

        <div style="overflow-x:auto;">
          <table class="data-table" id="res-main-table">
            <thead>
              <tr>
                <th style="width:55%;">File Name</th>
                <th style="width:20%;">Category</th>
                <th style="width:25%;text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody id="res-tbody"></tbody>
          </table>
        </div>

        <div class="empty-state" id="res-empty" style="display:none;">
          <i class="fas fa-folder-open"></i>
          No files match your search.
        </div>

        <div class="table-pagination" id="res-pagination"></div>

      </div>
    </div>
  </section>

  <div id="site-footer-mount"></div>

  <script src="js/script.js"></script>

      { name: 'AO No. 14 S. 2018 - Omnibus Guidelines on Social Technology Development', category: 'Law', url: 'https://stb.dswd.gov.ph/wp-content/uploads/2020/12/AO-No.-14-series-of-2018.pdf', icon: 'fa-eye' },
      { name: 'AO No. 34 S. 2003 - Framework for Social Technology Development', category: 'Law', url: 'https://stb.dswd.gov.ph/wp-content/uploads/2020/12/AO-No.-34-series-of-2003-Framework-.-..pdf', icon: 'fa-eye' },

      { name: 'MC. No. 33 S. 2020 - Guidelines for the Implementation of Yakap Bayan Program', category: 'Law', url: 'https://stb.dswd.gov.ph/wp-content/uploads/2020/12/MC.-N0-33-Guidelines-for-Inplmentation-of-YB-Program.pdf', icon: 'fa-eye' },
      { name: 'Buklod Paglaom Para sa CICL Manual', category: 'Manual', url: 'https://bit.ly/3z6y05O', icon: 'fa-eye' },

      { name: 'COMPRE', category: 'Briefer', url: 'https://drive.google.com/file/d/1mGl_vJuBa4NBH7TwrDHTUq0lTvhtUuyk/view?usp=sharing', icon: 'fa-eye' },

      { name: 'CTCVAFE', category: 'Briefer', url: 'https://drive.google.com/file/d/14H2mW8-HrSFX-pOxuxwSgljzX0oPm_rk/view?usp=sharing', icon: 'fa-eye' },
      { name: 'FDAPP', category: 'Briefer', url: 'https://drive.google.com/file/d/1Jvr7JCLj3nJSUX71sgF68dlo1mSt-CBd/view?usp=sharing', icon: 'fa-eye' },
      { name: 'GRCM', category: 'Briefer', url: 'https://drive.google.com/file/d/10dE_GecpjrTI-iQhwRwAFDmn96NgPNCN/view?usp=sharing', icon: 'fa-eye' },
      { name: 'Home Care', category: 'Briefer', url: 'https://drive.google.com/file/d/1LBJhK6vHmsjCfOrsoRzOYBezrwJfw0Jr/view?usp=sharing', icon: 'fa-eye' },
      { name: 'Intergen', category: 'Briefer', url: 'https://drive.google.com/file/d/1Vhgk87haQIsty9n4ao_PeTRAYvmA3Qzk/view?usp=sharing', icon: 'fa-eye' },
      { name: 'JNS', category: 'Briefer', url: 'https://drive.google.com/file/d/1lrjV7DZ98LUekmDcH7T-yg_C575D-8JM/view?usp=sharing', icon: 'fa-eye' },
      { name: 'ReSPPEC', category: 'Briefer', url: 'https://drive.google.com/file/d/1qRBUZtiPdfZEw40yfFU0kVUvXwobtBAT/view?usp=sharing', icon: 'fa-eye' },
      { name: 'SaLInLAHI', category: 'Briefer', url: 'https://drive.google.com/file/d/1GU2FfzzYryXSotAvwQGduDinXkFBaAkE/view?usp=sharing', icon: 'fa-eye' },
      { name: 'Sheltered Workshop', category: 'Briefer', url: 'https://drive.google.com/file/d/1H9te-VgP-52a7vYUAUuw3A66IsG6A1Bp/view?usp=sharing', icon: 'fa-eye' },
      { name: 'SHIELD', category: 'Briefer', url: 'https://drive.google.com/file/d/1VaNkxAzPEbiAAxDxAY4HWXBTacatA0oZ/view?usp=sharing', icon: 'fa-eye' },
      { name: 'SDEC', category: 'Briefer', url: 'https://drive.google.com/file/d/1PAZSS7tdTk5CMevwNnBKXiXv5wOS-rmW/view?usp=sharing', icon: 'fa-eye' },
      { name: 'START', category: 'Briefer', url: 'https://drive.google.com/file/d/1i5XNth8se1QRhcWwZEsoej9ir2b7rZDH/view?usp=sharing', icon: 'fa-eye' },
      { name: 'TeamBRE', category: 'Briefer', url: 'https://drive.google.com/file/d/1_ksi8OPMU97Cv0d_ZTP8w_NPNPE7a9_s/view?usp=sharing', icon: 'fa-eye' },
      { name: 'WFS', category: 'Briefer', url: 'https://drive.google.com/file/d/1LJTrBzR-QaUbuUbFO3MOKV11XhtFF9bw/view?usp=sharing', icon: 'fa-eye' },
      { name: 'Pro-forma - MOA Template for Multiple STs', category: 'Form', url: 'https://docs.google.com/document/d/1LttBwCd-eMW-cLtkdbEfo_kgffLMPTmW/edit?usp=sharing&ouid=106087644683244978922&rtpof=true&sd=true', icon: 'fa-eye' },
      { name: 'Pro-forma - Compre MOA 2022', category: 'Form', url: 'https://docs.google.com/document/d/1eBu2BNSD2kca2eCS2nOI1N9u3bI9-AojRQWWfdalI1c/edit?usp=sharing', icon: 'fa-eye' },
      { name: 'Pro-forma - SB Resolution (Sample: Buklod)', category: 'Form', url: 'https://stb.dswd.gov.ph/wp-content/uploads/2020/12/Pro-forma-SB-Resolution-Buklod-converted.pdf', icon: 'fa-eye' },
      { name: 'Pro-forma - Yakap Bayan Program (YBP) SB Resolution for Replication', category: 'Form', url: 'https://stb.dswd.gov.ph/wp-content/uploads/2020/12/YBP-SB-RESOLUTION-FOR-REPLICATION-OCT-14-converted.pdf', icon: 'fa-eye' },
      { name: 'Pro-forma - Consent Form for Photos and Videos', category: 'Form', url: 'https://docs.google.com/document/d/1PYKyG62hUvObrQVZD99Y35gnDOUd0vAR/edit?usp=sharing&ouid=106087644683244978922&rtpof=true&sd=true', icon: 'fa-eye' },
      { name: 'Pro-forma - Expression of Interest (EOI)', category: 'Form', url: 'https://stb.dswd.gov.ph/wp-content/uploads/2020/12/Expression-of-Interest-converted.pdf', icon: 'fa-eye' },
      { name: 'STB Framework and Development Process PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1ldFHAcy_dXCX9MiMIB2SAP8BxaP5yZze/view', icon: 'fa-eye' },
      { name: 'Aruga at Kalinga PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/18EUNQe_lGOYF6nPR4NGDCDbTTYQYfp9Z/view', icon: 'fa-eye' },
      { name: 'Buklod Paglaom PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1ZfiEReyjL3FQUXeHVPE7huvwhwnLDK62/view', icon: 'fa-eye' },
      { name: 'Buklod Paglaom (Orientation Video Slides)', category: 'Presentation', url: 'https://drive.google.com/file/d/13eih24ljKQxViajOHWyiuVD4bbZ4uThC/view?usp=sharing', icon: 'fa-eye' },
      { name: 'CARe-ABLE PPT', category: 'Presentation', url: 'https://drive.google.com/file/d/1SwwJn-s-3epsN1BQ3-32lZRcay8RBLCa/view', icon: 'fa-eye' },
      { name: 'COMPRE_ TASK FORCE', category: 'Presentation', url: 'https://drive.google.com/file/d/1vo1ihdaFo7YmCXWfslUWR0f-BhQfBtAl/view', icon: 'fa-eye' },
      { name: 'FDAPP PPT', category: 'Presentation', url: 'https://drive.google.com/file/d/1EVnLnaSCvKmmDv3EoLaGHCvu_Psou4Cd/view', icon: 'fa-eye' },
      { name: 'GRCM PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1twD3lRecf0DlQVl4Z0Tk7Z5tY0ACh3mS/view', icon: 'fa-eye' },
      { name: 'HCSSSC (HomeCare)', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1Mr51bKjaV9byq4X6i2lHF5u-Nz3V52gI/view', icon: 'fa-eye' },
      { name: 'ReSPECC PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1tGG9oVBeo7Y91j3_8guB4OpjvJYy5Gu-/view', icon: 'fa-eye' },
      { name: 'SaLInLAHI PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1JeUqR1Z0DdjZi_poCJhaVaFbI33-NNIN/view', icon: 'fa-eye' },
      { name: 'SDEC PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1XtzkXRRhZ9okytiJCfd6SAqoRaMrp0EP/view', icon: 'fa-eye' },
      { name: 'SHIELD PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1Qz0xIVaRgSB0GQRjCjhGP-KXpNqP3hY9/view', icon: 'fa-eye' },
      { name: 'TeamBRE PPT', category: 'Presentation', url: 'https://drive.google.com/file/d/1yK9vHIyZL9mcBqaxOE1dXrZqtLK4Tzqe/view', icon: 'fa-eye' },
      { name: 'WFS PPT', category: 'Presentation', url: 'https://docs.google.com/presentation/d/1E47HgsfHS80fuU6v2EbNXrNYaeqF9hDl/view', icon: 'fa-eye' },
      { name: 'WFS', category: 'Video', url: 'https://stb.dswd.gov.ph/wfs/', icon: 'fa-play-circle' },
      { name: 'GRCM', category: 'Video', url: 'https://stb.dswd.gov.ph/grcm/', icon: 'fa-play-circle' },
      { name: 'CIAGV', category: 'Video', url: 'https://stb.dswd.gov.ph/ciagv/', icon: 'fa-play-circle' },
      { name: 'SHIELD', category: 'Video', url: 'https://stb.dswd.gov.ph/shield/', icon: 'fa-play-circle' },
    ];

    const CHIP_CLASS = {
      'Law': 'chip-law', 'Manual': 'chip-manual', 'Guidelines': 'chip-guidelines',
      'Briefer': 'chip-briefer', 'Storybook': 'chip-storybook', 'Primer': 'chip-primer',
      'Form': 'chip-form', 'Presentation': 'chip-presentation', 'Video': 'chip-video'
    };

    let currentPage = 1;
    let filtered = ALL_RESOURCES.slice();

    const tbody = document.getElementById('res-tbody');
    const pagination = document.getElementById('res-pagination');
    const tableInfo = document.getElementById('res-table-info');
    const emptyState = document.getElementById('res-empty');
    const searchInput = document.getElementById('res-search');
    const categoryFilter = document.getElementById('res-category-filter');

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;
      filtered = ALL_RESOURCES.filter(r => {
        const matchName = !q || r.name.toLowerCase().includes(q);
        const matchCat = !cat || r.category === cat;
        return matchName && matchCat;
      });
      currentPage = 1;
      render();
    }

    function render() {
      tbody.innerHTML = '';
      const total = filtered.length;
      const totalPages = Math.max(1, Math.ceil(total / ROWS_PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * ROWS_PER_PAGE;
      const pageRows = filtered.slice(start, start + ROWS_PER_PAGE);

      if (total === 0) {
        emptyState.style.display = '';
        document.getElementById('res-main-table').style.display = 'none';
        tableInfo.textContent = '';
        pagination.innerHTML = '';
        return;
      }

      emptyState.style.display = 'none';
      document.getElementById('res-main-table').style.display = '';

      const endRow = Math.min(start + ROWS_PER_PAGE, total);
      tableInfo.textContent = 'Showing ' + (start + 1) + '–' + endRow + ' of ' + total + ' file' + (total !== 1 ? 's' : '');

      pageRows.forEach(r => {
        const tr = document.createElement('tr');
        const chipClass = CHIP_CLASS[r.category] || 'chip-briefer';
        tr.innerHTML =
          '<td><a href="' + r.url + '" target="_blank" class="file-name-link">' + r.name + '</a></td>' +
          '<td><span class="category-chip ' + chipClass + '">' + r.category + '</span></td>' +
          '<td><div class="action-icons" style="justify-content:center;">' +
          '<a href="' + r.url + '" target="_blank"><button class="action-icon-btn view" title="View file"><i class="fas ' + r.icon + '"></i></button></a>' +
          '</div></td>';
        tbody.appendChild(tr);
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      pagination.innerHTML = '';
      if (totalPages <= 1) return;

      function btn(label, page, disabled, active) {
        const b = document.createElement('button');
        b.innerHTML = label;
        if (disabled) b.disabled = true;
        if (active) b.classList.add('active');
        if (!disabled) b.addEventListener('click', () => { currentPage = page; render(); });
        return b;
      }

      pagination.appendChild(btn('&laquo;', currentPage - 1, currentPage === 1, false));

      let start = Math.max(1, currentPage - 2);
      let end = Math.min(totalPages, start + 4);
      if (end - start < 4) start = Math.max(1, end - 4);

      if (start > 1) { pagination.appendChild(btn('1', 1, false, false)); if (start > 2) { const e = document.createElement('button'); e.textContent = '…'; e.disabled = true; pagination.appendChild(e); } }
      for (let p = start; p <= end; p++) pagination.appendChild(btn(p, p, false, p === currentPage));
      if (end < totalPages) { if (end < totalPages - 1) { const e = document.createElement('button'); e.textContent = '…'; e.disabled = true; pagination.appendChild(e); } pagination.appendChild(btn(totalPages, totalPages, false, false)); }

      pagination.appendChild(btn('&raquo;', currentPage + 1, currentPage === totalPages, false));
    }

    searchInput.addEventListener('input', applyFilters);
    categoryFilter.addEventListener('change', applyFilters);

    render();
  })();
  </script>
</body>
</html>
