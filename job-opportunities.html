<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Opportunities — STB DSWD</title>
  <link rel="icon" type="image/webp" href="images/stb-new-logo.webp" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .jobs-section { padding: 72px 0; background: var(--white); }
    .jobs-section .label-tag { margin-bottom: 10px; }
    .jobs-section h1 { font-size: 36px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; }
    .jobs-section .section-subtitle { font-size: 15px; color: var(--text-medium); margin-bottom: 32px; max-width: 600px; }
    .section-divider { margin: 12px 0 24px; }

    .jobs-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .jobs-search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .jobs-search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 13px;
    }
    .jobs-search-wrap input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      color: #374151;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .jobs-search-wrap input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(0,48,135,0.08);
    }

    /* Custom dropdown */
    .custom-select-wrap {
      position: relative;
      min-width: 190px;
    }
    .custom-select-wrap select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      padding: 10px 36px 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      color: #374151;
      background: #fff;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .custom-select-wrap select:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(0,48,135,0.08);
    }
    .custom-select-wrap::after {
      content: '';
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-60%) rotate(45deg);
      width: 6px;
      height: 6px;
      border-right: 1.5px solid #6b7280;
      border-bottom: 1.5px solid #6b7280;
      pointer-events: none;
    }

    .jobs-table-info { font-size: 13px; color: #6b7280; margin-bottom: 8px; }

    .jobs-table-wrap { overflow-x: auto; }

    .jobs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .jobs-table thead tr {
      background: var(--primary-blue);
      color: #fff;
    }
    .jobs-table th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .jobs-table tbody tr {
      border-bottom: 1px solid #e5e7eb;
      transition: background 0.15s;
    }
    .jobs-table tbody tr:hover { background: #f0f4ff; }
    .jobs-table td {
      padding: 12px 16px;
      color: #374151;
      vertical-align: middle;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-open { background: #d1fae5; color: #065f46; }
    .status-closed { background: #fee2e2; color: #991b1b; }
    .status-pending { background: #fef3c7; color: #92400e; }

    .jobs-empty {
      padding: 48px 0;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }
    .jobs-empty i { font-size: 36px; margin-bottom: 12px; display: block; color: #d1d5db; }

    .table-pagination { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 14px 0 4px; flex-wrap: wrap; }
    .table-pagination button { min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid #d1d5db; background: #fff; color: #374151; font-size: 13px; border-radius: 6px; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; font-family: inherit; }
    .table-pagination button:hover:not(:disabled) { background: #f3f4f6; border-color: #9ca3af; }
    .table-pagination button.active { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); font-weight: 600; }
    .table-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="site-header-mount"></div>

  <section class="jobs-section">
    <div class="container">
      <span class="label-tag">Careers</span>
      <h1>Job Opportunities</h1>
      <div class="section-divider"></div>
      <p class="section-subtitle">Explore career openings at the Social Technology Bureau — DSWD and be part of meaningful public service.</p>

      <div class="jobs-controls">
        <div class="jobs-search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="jobs-search" placeholder="Search position…" autocomplete="off" />
        </div>
        <div class="custom-select-wrap">
          <select id="jobs-status-filter">
            <option value="">All Status</option>
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
            <option value="Pending">Pending</option>
          </select>
        </div>
        <div class="custom-select-wrap">
          <select id="jobs-division-filter">
            <option value="">All Divisions</option>
          </select>
        </div>
      </div>

      <div class="jobs-table-info" id="jobs-table-info"></div>

      <div class="jobs-table-wrap">
        <table class="jobs-table" id="jobs-table">
          <thead>
            <tr>
              <th>Position</th>
              <th>Salary</th>
              <th>Item No.</th>
              <th>Status</th>
              <th>Division / Unit</th>
              <th>Deadline of Submission</th>
            </tr>
          </thead>
          <tbody id="jobs-tbody"></tbody>
        </table>
      </div>

      <div class="jobs-empty" id="jobs-empty" style="display:none;">
        <i class="fas fa-briefcase"></i>
        <p>No positions found.</p>
      </div>

      <div class="table-pagination" id="jobs-pagination"></div>

    </div>
  </section>

  <div id="site-footer-mount"></div>

  <script src="js/script.js"></script>
  <script>
    (function () {
      const ROWS_PER_PAGE = 10;

      const data = [
        { position: 'Information Technology Officer I', salary: 'SG-19 / ₱48,649', itemNo: 'STB-005', status: 'Closed', division: 'Social Technology Assessment and Evaluation Division', deadline: 'April 30, 2026' },
      ];

      let currentPage = 1;
      let filtered = [...data];

      // Populate division filter
      const extraDivisions = ['Design Formulation Division', 'Pilot Implementation Division'];
      const divisions = [...new Set([...data.map(r => r.division), ...extraDivisions])].sort();
      const divSel = document.getElementById('jobs-division-filter');
      divisions.forEach(d => {
        const o = document.createElement('option');
        o.value = d; o.textContent = d;
        divSel.appendChild(o);
      });

      function statusClass(s) {
        if (s === 'Open') return 'status-open';
        if (s === 'Closed') return 'status-closed';
        return 'status-pending';
      }

      function render() {
        const q = document.getElementById('jobs-search').value.trim().toLowerCase();
        const st = document.getElementById('jobs-status-filter').value;
        const dv = divSel.value;

        filtered = data.filter(r => {
          const matchQ = !q || r.position.toLowerCase().includes(q) || r.itemNo.toLowerCase().includes(q) || r.division.toLowerCase().includes(q);
          const matchSt = !st || r.status === st;
          const matchDv = !dv || r.division === dv;
          return matchQ && matchSt && matchDv;
        });

        const total = filtered.length;
        const pages = Math.max(1, Math.ceil(total / ROWS_PER_PAGE));
        if (currentPage > pages) currentPage = 1;

        const start = (currentPage - 1) * ROWS_PER_PAGE;
        const pageRows = filtered.slice(start, start + ROWS_PER_PAGE);

        const tbody = document.getElementById('jobs-tbody');
        tbody.innerHTML = '';
        pageRows.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${r.position}</strong></td>
            <td>${r.salary}</td>
            <td>${r.itemNo}</td>
            <td><span class="status-badge ${statusClass(r.status)}">${r.status}</span></td>
            <td>${r.division}</td>
            <td>${r.deadline}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('jobs-empty').style.display = total === 0 ? 'block' : 'none';
        document.getElementById('jobs-table').style.display = total === 0 ? 'none' : '';
        document.getElementById('jobs-table-info').textContent = total > 0 ? `Showing ${start + 1}–${Math.min(start + ROWS_PER_PAGE, total)} of ${total} position${total !== 1 ? 's' : ''}` : '';

        renderPagination(pages);
      }

      function renderPagination(pages) {
        const el = document.getElementById('jobs-pagination');
        el.innerHTML = '';
        if (pages <= 1) return;

        const prev = document.createElement('button');
        prev.innerHTML = '<i class="fas fa-chevron-left"></i>';
        prev.disabled = currentPage === 1;
        prev.addEventListener('click', () => { currentPage--; render(); });
        el.appendChild(prev);

        for (let i = 1; i <= pages; i++) {
          const btn = document.createElement('button');
          btn.textContent = i;
          if (i === currentPage) btn.classList.add('active');
          btn.addEventListener('click', () => { currentPage = i; render(); });
          el.appendChild(btn);
        }

        const next = document.createElement('button');
        next.innerHTML = '<i class="fas fa-chevron-right"></i>';
        next.disabled = currentPage === pages;
        next.addEventListener('click', () => { currentPage++; render(); });
        el.appendChild(next);
      }

      document.getElementById('jobs-search').addEventListener('input', () => { currentPage = 1; render(); });
      document.getElementById('jobs-status-filter').addEventListener('change', () => { currentPage = 1; render(); });
      divSel.addEventListener('change', () => { currentPage = 1; render(); });

      render();
    })();
  </script>
</body>
</html>
